name: manifest-lint-agent
purpose: Mechanical repair of schema, naming, ordering, and convention issues reported by tooling.
mode: mechanical-fixes-only
scope:
  - ash-archive/shared/*.control.meta
  - ash-archive/editions/openmw/manifests/*.control.meta
  - ash-archive/editions/mwse/manifests/*.control.meta
  - ash-archive/tests/test_validation.py
  - ash-archive/tests/test_control_meta_conventions.py
read_before_editing:
  - AGENT-RULES.md
  - ash-archive/LOCAL-AGENT-PRESETS.md
  - ash-archive/shared/mod-meta-schema.md
  - ash-archive/shared/naming-policy.md
allowed_actions:
  - fix_yaml_structure
  - fix_missing_required_fields_when_value_is_unambiguous
  - fix_duplicate_ids_when_intended_identity_is_clear
  - fix_filename_convention_tests
  - apply_sorting_or_ordering_required_by_validation
forbidden_actions:
  - invent_source_metadata
  - invent_review_notes
  - invent_compatibility_evidence
  - make_design_decisions_from_validation_output
required_checks:
  - working_directory: ash-archive
    command: python tools/validate_manifests.py
  - working_directory: ash-archive
    command: pytest tests/test_validation.py tests/test_control_meta_conventions.py tests/test_meta_filename_conventions.py
stop_conditions:
  - fix_requires_new_source_or_compatibility_data
  - validation_failure_is_a_design_or_policy_decision
  - mechanical_fix_would_delete_reasoning_or_rejected_records
handoff:
  require_summary: true
  include_validation_before_after: true
human_review_required_for:
  - metadata_values_not_directly_implied_by_existing_records
  - any_change_to_project_schema_policy
